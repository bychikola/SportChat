  /Pari/matches:
    get:
      tags:
        - Pari
      summary: Список матчей
      description: >-
        Должен быть указан хотя бы один фильтр.

        Параметры live и upcoming можно комбинировать — тогда возвращаются матчи
        с любым из указанных статусов.

        Параметр date имеет приоритет над dateFrom/dateTo.


        **Формат дат:** `YYYY-MM-DD`. Время и часовой пояс игнорируются —
        фильтрация всегда по дню UTC.


        **Пример — матчи за сегодня (2026-05-01):**

        ```

        GET /pari/matches?date=2026-05-01

        ```


        Рекомендуется всегда указывать дату (только если не передан live). Так
        данные будут извлекаться быстрее 


        **Сортировка**: Если заданы даты, или live или upcoming, то сортировка
        по возрастанию. Иначе по убыванию


        ---


        ## Пагинация (постраничная загрузка)


        Метод **никогда не возвращает все матчи сразу** — только срез размером
        `limit` начиная с позиции `offset`.

        Это сделано специально, чтобы не перегружать клиент и канал при большом
        количестве данных.


        В ответе всегда есть поле `totalCount` — общее количество матчей,
        удовлетворяющих фильтру.

        Сравнивайте его с количеством уже полученных записей, чтобы понять — все
        ли данные загружены.


        **Алгоритм получения всех данных:**


        1. Первый запрос: `offset=0&limit=100` — получаете первые 100 матчей и
        значение `totalCount`.

        2. Если `totalCount > 100`, делаете следующий запрос:
        `offset=100&limit=100`.

        3. Продолжаете увеличивать `offset` на `limit` до тех пор, пока `offset
        >= totalCount`.


        **Пример — загрузить все матчи за день (предположим, их 250):**

        ```

        GET /pari/matches?date=2026-05-01&offset=0&limit=100   → получено
        100,  totalCount=250

        GET /pari/matches?date=2026-05-01&offset=100&limit=100 → получено
        100,  totalCount=250

        GET /pari/matches?date=2026-05-01&offset=200&limit=100 → получено
        50,   totalCount=250

        ```

        После третьего запроса `offset(200) + полученных(50) = 250 = totalCount`
        — все данные получены.


        **Советы:**

        - Максимальный `limit` — **1000**. Увеличивайте его, чтобы уменьшить
        число запросов.

        - Коэффициенты в списке матчей возвращаются в легком формате `{ id,
        value }`. Названия исходов можно получить через
        `/pari/odds/market-types`.

        - Не меняйте фильтры и порядок сортировки между запросами одной серии —
        иначе страницы не совпадут.
      parameters:
        - name: countryId
          in: query
          description: Id страны из списка [/pari/countries](#tag/pari/GET/Pari/countries)
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: leagueId
          in: query
          description: Id лиги (из эндпоинта /leagues или сайта Pari.ru)
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: date
          in: query
          description: "Конкретный день. Формат: YYYY-MM-DD (например, 2026-05-01). Если
            указан, dateFrom и dateTo игнорируются"
          schema:
            type: string
            format: date-time
        - name: dateFrom
          in: query
          description: "Начало диапазона дат включительно. Формат: YYYY-MM-DD"
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: "Конец диапазона дат включительно. Формат: YYYY-MM-DD"
          schema:
            type: string
            format: date-time
        - name: teamId
          in: query
          description: Id команды
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: live
          in: query
          description: Только лайв матчи (статус Live и WillStartSoon)
          schema:
            type: boolean
        - name: upcoming
          in: query
          description: Только предстоящие матчи (статус NotStarted)
          schema:
            type: boolean
        - name: sortDesc
          in: query
          description: "Явное управление сортировкой: true — по убыванию StartDate, false
            — по возрастанию. Если не указан, направление выбирается
            автоматически"
          schema:
            type: boolean
        - name: includeOdds
          in: query
          description: Если true, возвращает актуальные коэффициенты для матчей в формате
            id/value
          schema:
            type: boolean
            default: false
        - name: showDeleted
          in: query
          description: Показывать матчи, удаленны из линии ещё до их начала
          schema:
            type: boolean
            default: false
        - name: timezone
          in: query
          description: UTC offset в часах (например, 3 = Москва). Сдвигает границы дат при
            фильтрации по date/dateFrom/dateTo
          schema:
            maximum: 12
            minimum: -12
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 3
        - name: offset
          in: query
          description: "Сколько записей пропустить от начала выборки. Для первого запроса
            — 0. Для следующей страницы прибавьте к offset значение limit
            (например, 0 → 100 → 200). По умолчанию: 0"
          schema:
            maximum: 2147483647
            minimum: 0
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: limit
          in: query
          description: "Максимальное количество записей в ответе. По умолчанию: 100.
            Максимум: 1000, или 200 при includeOdds=true. Сравните количество
            полученных записей с полем totalCount в ответе, чтобы понять, есть
            ли ещё данные"
          schema:
            maximum: 1000
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiPariMatch[]"
  /Pari/match/{eventId}:
    get:
      tags:
        - Pari
      summary: Данные матча
      description: >-
        Самые актуальные на данный момент данные по матчу
                    
        Обновление данных: раз в 3 секунды
                    
        ## Логика заполнения коэффициентов
                    
        - **Матч ещё не начался** — актуальные доматчевые коэффициенты
        возвращаются в `currentOdds`, поле `prematchOdds` пустое.

        - **Матч идёт (лайв)** — в `currentOdds` лайв-коэффициенты, в
        `prematchOdds` — последние доматчевые значения (последние коэффициенты
        до того как матч получил статус Live).

        - **Матч завершён** — `currentOdds` пустое, в `prematchOdds` остаются
        последние доматчевые коэффициенты.
      parameters:
        - name: eventId
          in: path
          description: Id события на сайте pari.ru
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiPariMatch"
  /Pari/odds/history/{eventId}:
    get:
      tags:
        - Pari
      summary: История коэффициентов
      description: >-
        История изменения коэффициентов (доматчевые и лайв)
                    
        Коэффициент может быть заблокирован (IsBlocked), это значит на него
        нельзя поставить в данный момент, но при этом его значения могут
        обновляться.

        Помимо блокировок отдельных коэффициентов может быть блокировка всей
        линии (IsSuspended)

        Такое обычно происходит в момент когда в игре происходит важное игровое
        событие (VAR, пенальти...) либо букмекер пересчитывает линию.


        Если значение коэффициента = 0, значит в этот момент коэффициент был
        удален из линии
      parameters:
        - name: eventId
          in: path
          description: Id события (матча) на сайте Pari.ru
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
        - name: oddsType
          in: query
          description: "Тип коэффициентов: live | prematch"
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiPariOddsUpdate[]"
  /Pari/events/{matchId}:
    get:
      tags:
        - Pari
      summary: Игровые события и статистика матча
      description: >-
        Возвращает список игровых событий и накопленную статистику матча,
        вычисленную из потока сырых событий Pari.ru.
                    
        Полный список всех поддерживаемых типов событий
        [/Pari/events/types](#tag/pari/GET/Pari/events/types)


        Обновление данных: раз в 10 секунд
      parameters:
        - name: matchId
          in: path
          description: Id матча на сайте pari.ru
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiPariEvents"
  /Pari/teams:
