  /Players/find:
    get:
      tags:
        - Players
      summary: Поиск игрока
      description: >-
        Выполняет поиск футболистов по имени или его части. Поиск не
        чувствителен к регистру и находит всех игроков, 

        в именах которых содержится указанная подстрока.


        **Особенности:**

        - Поиск выполняется по частичному совпадению

        - Регистр символов не учитывается  

        - Максимальное количество результатов: 100

        - В ответе включается информация о текущей команде игрока


        **Пример использования:**

        - `name=ronaldo` - найдет игроков с именем, содержащим "Ronaldo"

        - `name=John` - найдет всех игроков с именем, содержащим "John"
      parameters:
        - name: name
          in: query
          description: Имя или часть имени игрока для поиска (минимум 1 символ)
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaPlayerWithTeam[]"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /Players/{id}:
    get:
      tags:
        - Players
      summary: Данные по игроку
      description: "Полные данные по игроку: текущая команда и история трансферов"
      parameters:
        - name: id
          in: path
          description: ""
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
