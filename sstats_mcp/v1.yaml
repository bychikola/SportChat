            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: Limit
          in: query
          schema:
            maximum: 1000
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: Список команд с информацией о пагинации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaTeam[]"
  /Teams/{id}:
    get:
