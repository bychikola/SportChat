                  $ref: "#/components/schemas/ApiSaInjury"
  /Leagues:
    get:
      tags:
        - Leagues
      summary: Список
      description: Список всех лиг и их сезонов
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaLeagueWithSeasons[]"
  /Ls/List:
    get:
      tags:
        - Ls
      summary: Список матчей
      description: >-
        Получение списка футбольных матчей с гибкими возможностями фильтрации и
        сортировки.


        **Основные возможности:**

        - Поиск по конкретным матчам, лигам, сезонам и командам

        - Фильтрация по временным периодам (конкретная дата или диапазон)

        - Отбор матчей по статусу: завершенные, текущие (лайв) или предстоящие

        - Пагинация результатов (до 1000 матчей за запрос)

        - Сортировка по дате проведения матча


        **Примеры использования:**

        - `?Date=2025-06-21` - все матчи за конкретный день

        - `?From=2025-06-01&To=2025-06-30` - матчи за период

        - `?LeagueId=england/premier-league&Ended=true` - завершенные матчи лиги

        - `?Team=arsenal/hA1Zm19f&Live=true` - текущие матчи команды

        - `?BothTeams=villa/ALztxK6e,chelsea/4fGZN2oK` - матчи между двумя
        командами


        ⚠️ **Обязательно** укажите хотя бы один параметр фильтрации, иначе
        запрос будет отклонен.
                    
         #### Статусы матча
        | Id | Название |

        |----|----------|

        | 1 | Не начался |

        | 45 | К завершению |

        | 42 | Ожидание обновлений |

        | 2 | В прямом эфире |

        | 12 | Первый тайм |

        | 13 | Второй тайм |

        | 6 | Дополнительное время |

        | 7 | Пенальти |

        | 46 | Технический перерыв |

        | 3 | Завершён |

        | 10 | После дополнительного времени |

        | 11 | После пенальти |

        | 9 | Техническая победа |

        | 43 | Отложен |

        | 36 | Прерван |

        | 5 | Отменён |

        | 54 | Присуждён |
      parameters:
        - name: Id
          in: query
          description: Id матча. Один или несколько через запятую.
          schema:
            maxLength: 300
            pattern: ^\w+(?:,\w+)*$
            type: string
          example: '"000agg7D или 000agg7D,zZKMD6Z6"'
        - name: LeagueId
          in: query
          description: >-
            Id лиги

            <remarks>Список лиг можно получить через
            <code>/Ls/Leagues</code></remarks>
          schema:
            maxLength: 255
            type: string
        - name: SeasonId
          in: query
          description: Уникальный идентификатор сезона
          schema:
            type: string
        - name: Years
          in: query
          description: "Года сезона (Например: 2024-2025)"
          schema:
            type: string
          example: '"2024-2025"'
        - name: Date
          in: query
          description: >-
            Конкретная дата. В выборку будут включены все матчи за выбранный
            день. Чтобы указать часовой пояс, используйте параметр
            <code>TimeZone</code>.

            <example>2025-06-02</example>
          schema:
            type: string
            format: date
        - name: From
          in: query
          description: >-
            Начальная дата. Если указана только дата без времени, то будут
            включены все матчи за текущую дату, начиная с полуночи.

            Если не указывается время с часовым поясом
            (2025-06-17T14:23:30+02:00), то часовой пояс необходимо передать
            отдельно в параметре <code>TimeZone</code><remarks>

            Дата + время + часовой пояс: 2025-06-17T14:23:30+02:00 

            Дата + время: 2025-06-17T14:23:30

            Дата + время (без секунд): 2025-06-17T14:23

            Дата: 2025-06-17</remarks>
          schema:
            type: string
        - name: To
          in: query
          description: >-
            Конечная дата. Фильтруются все матчи строго до этой даты. Если
            указана только дата, без времени, то в выборку включаются все матчи
            до полуночи указанной даты.

            Для всех дат, где не указан часовой пояс (+02:00) необходимо указать
            часовой пояс отдельно в параметре <code>TimeZone</code>

            Например: если To = 2025-06-02, то в выборку попадут все матчи
            до  2025-06-02 00:00:00. Т.е матчи за само 2025-06-02 уже выборку не
            попадают

            <remarks>

            Дата + время + часовой пояс: 2025-06-17T14:23:30+02:00 

            Дата + время: 2025-06-17T14:23:30

            Дата + время (без секунд): 2025-06-17T14:23

            Дата: 2025-06-17</remarks>
          schema:
            type: string
        - name: Status
          in: query
          description: Статус
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: uint8
        - name: HomeTeam
          in: query
          description: >-
            Id команды хозяев (один, или несколько через запятую)

            <example>"jk-arsenal/MgkAqSU0 или
            jk-arsenal/MgkAqSU0,villa/ALztxK6e"</example>
          schema:
            maxLength: 300
            pattern: ^[\w\/\-]+(?:,[\w\/\-]+)*$
            type: string
        - name: AwayTeam
          in: query
          description: |-
            Id команды гостей (один, или несколько через запятую)
            <example>"123 или 123,456"</example>
          schema:
            pattern: ^[\w\/\-]+(?:,[\w\/\-]+)*$
            type: string
        - name: Team
          in: query
          description: >-
            Id одной из команд (один, или несколько через запятую).

            <remarks>Если указано несколько Id, то выборку попадут все матчи,
            где хотя бы одна из команд в это списке</remarks><example>"123 или
            123,456"</example>
          schema:
            pattern: ^[\w\/\-]+(?:,[\w\/\-]+)*$
            type: string
        - name: BothTeams
          in: query
          description: |-
            Id двух команд через запятую. Матчи двух команд между собой
            <example>"123,456"</example>
          schema:
            pattern: ^[\w\/\-]+(?:,[\w\/\-]+)*$
            type: string
        - name: Ended
          in: query
          description: Завершенные матчи (8, 9, 10, 17, 18)
          schema:
            type: boolean
        - name: Live
          in: query
          description: Лайв матчи (статусы 3, 4, 5, 6, 7, 11, 18, 19)
          schema:
            type: boolean
        - name: Upcoming
          in: query
          description: "Предстоящие матчи (дата начала матча больше текущего времени +
            статус: 1,2)"
          schema:
            type: boolean
        - name: Offset
          in: query
          description: >-
            Пропустить указанное количество матчей от начала выборки. По
            умолчанию = 0

            <remarks>

            Количество матчей выводимое за раз ограничено лимитом 1000 матчей.
            Чтобы извлечь остальные матчи, используется Offset c указанием
            количества, которое надо пропустить.

            <code>offset=2000</code> - пропустить первые 2000 матчей и получить
            следущие 1000

            </remarks><example>2000</example>
          schema:
            maximum: 2147483647
            minimum: 0
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: Limit
          in: query
          description: Ограничить выборку указанным количеством матчей (от 1 до 1000)
          schema:
            maximum: 1000
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: Order
          in: query
          description: Сортировать по убыванию (Order=-1) или по возрастанию (Order=1)
            даты начала матча
          schema:
            maximum: 1
            minimum: -1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: TimeZone
          in: query
          description: Ваш часовой пояс (от -12 до 12). По умолчанию = 3
          schema:
            maximum: 12
            minimum: -12
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 3
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /Ls/Teams:
    get:
      tags:
        - Ls
      summary: Команды
      description: >-
        Поиск команды по заданным критериям поиска.


        **Параметры поиска:**

        - Поиск выполняется по одному из параметров в порядке приоритета: `uid`
        → `id` → `name`

        - При поиске по названию используется частичное совпадение (содержит
