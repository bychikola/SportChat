                $ref: "#/components/schemas/ApiResponseOfObject"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /Players/list:
    get:
      tags:
        - Players
      summary: Список игроков
      description: Список всех игроков. Только информация о самом игроке, без команд и
        трансферов
      parameters:
        - name: teamId
          in: query
          description: ""
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: offset
          in: query
          description: ""
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: limit
          in: query
          description: ""
          schema:
            maximum: 1000
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1000
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaPlayerFull[]"
  /Players/{id}/events:
    get:
      tags:
        - Players
      summary: События игрока
      description: >-
        Возвращает список событий указанного игрока в хронологическом порядке.


        **По умолчанию включает события где игрок:**

        - Является основным участником (голы, карточки, замены и т.д.)


        **При включении `includeAssists = true` дополнительно включает:**

        - События где игрок выступает в роли ассистента


        События сортируются по дате матча (новые сначала), затем по времени в
        матче.

        Поддерживается пагинация для работы с большими объемами данных.
      parameters:
        - name: id
          in: path
          description: Уникальный идентификатор игрока
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
        - name: includeAssists
          in: query
          description: Включать ли события где игрок является ассистентом (по умолчанию
            false)
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          description: Количество записей для пропуска (для пагинации)
          schema:
            maximum: 2147483647
            minimum: 0
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: limit
          in: query
          description: Максимальное количество записей в ответе (1-1000)
          schema:
            maximum: 1000
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1000
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaEvent[]"
  /Seasons/standings:
    get:
      tags:
