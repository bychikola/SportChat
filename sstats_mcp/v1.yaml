        - name: leagueId
          in: query
          description: ""
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: year
          in: query
          description: ""
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiStandings"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiStandings"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiStandings"
  /Teams/list:
    get:
      tags:
        - Teams
      summary: Список команд
      description: Список команд с возможностью фильтрации и пагинации
      parameters:
        - name: Name
          in: query
          description: Название команды
          schema:
            maxLength: 100
