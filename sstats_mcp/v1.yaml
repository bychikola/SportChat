openapi: 3.1.1
info:
  title: SStats.net - Football API
  description: "API футбольных матчей, доматчевые и live коэффициенты, статистика,
    профиты, Glicko 2\r

    \r

    Весь функционал API бесплатен, с ограничением по количеству запросов. \r

    Без api ключа ограничение 300 в минуту запросов на всех пользователей, или
    30 запросов в минуту на 1 IP адрес.\r

    \r

    [Введение в API](https://sstats.net/api)"
  contact:
    name: Поддержка
    url: https://vk.com/sstats_net
  version: 0.9.40.0
servers:
  - url: https://api.sstats.net
    description: SStats.net API
paths:
  /Account/Info:
    get:
      tags:
        - Account
      summary: Аккаунт
      description: Получение данных о текущем авторизированном пользователе
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfAccountInfo"
      security:
        - ApiAuthScheme: []
  /Excel/Delux:
    get:
      tags:
        - Excel
      summary: Delux
      description: >-
        Запрос используется в excel таблице для прогнозирования футбольных
        матчей DeluX_API-based.

        Эта таблица является модификацией таблицы *DeluX_plus IncoProrok.xlsm*,
        в которой парсер сайта Flashscore заменен на API сайта sstats.net
                    
        Запрос за раз выгружает все необходимые данные, которая требует таблица
        для анализа матча


        Подробнее о таблице и использованию запроса в руководстве [Excel
        Delux](https://sstats.net/posts/api-excel-delux)
                    
        Для получения данных по конкретному матчу необходимо указать *gameId*

        Для получения данных за день, необходимо указать *dayOffset*
      parameters:
        - name: gameId
          in: query
          description: ""
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: dayOffset
          in: query
          description: "День. 0 - сегодня, -1 - вчера, -2 - позавчера, 1 - завтра, 2 -
            после завтра и т.д. Диапазон: [-1000, 30]"
          schema:
            maximum: 30
            minimum: -1000
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: timeZone
          in: query
          description: Часовой пояс
          schema:
            maximum: 12
            minimum: -12
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 3
      responses:
        "200":
          description: ""
          content:
            text/plain: {}
  /Excel/FootballCalc:
    get:
      tags:
        - Excel
      summary: Football calculation
      description: >-
        Запрос, используемой в excel таблице для прогнозирования матчей
        football-calculation-table_API-based.xlsb
                    
        Эта таблица является модифицированной версией
        football-calculation-table-v.2.1-by-kish.xlsb


        Для получения данных по конкретному матчу необходимо указать *gameId*

        Для получения данных за день, необходимо указать *dayOffset*
      parameters:
        - name: gameId
          in: query
          description: Идентифиатор матча sstats.net
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: dayOffset
          in: query
          description: "День. 0 - сегодня, -1 - вчера, -2 - позавчера, 1 - завтра, 2 -
            после завтра и т.д. Диапазон: [-1000, 30]"
          schema:
            maximum: 30
            minimum: -1000
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: timeZone
          in: query
          description: Часовой пояс
          schema:
            maximum: 12
            minimum: -12
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 3
      responses:
        "200":
          description: ""
  /Excel/Results:
    get:
      tags:
        - Excel
      summary: Результаты
      description: |-
        Извлечение результатов матчей
                    
                    
        Ответ содержит таблицу  
        `Id,Date,HomeHalfTimeScore,AwayHalfTimeScore,HomeFullTimeScore,AwayFullTimeScore,Ended`
      parameters:
        - name: id
          in: query
          description: список матчей через запятую. Максимум 500 значений
          required: true
          schema:
            type: string
        - name: header
          in: query
          description: Включить заголовок в ответ
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: ""
          content:
            text/plain: {}
  /Games/list:
    get:
      tags:
        - Games
      summary: Список матчей
      description: |-
        Извлечение списка матчей. Данные о каждом матче возвращаются в сокращенном варианте (Id, время, статус, счет, названия команд их их ID, сезон, тур, коэффициенты).  
        Коэффициенты в сокращенном варианте: 1X2, Total. (на момент ближе к закрытию линии)

        Для получения полной информации о конкретном матче используется [/games/{id}](#tag/games/GET/Games/{id})
                    
        Одним запросом можно извлечь не более 1000 матчей. Чтобы извлечь остальные, нужно использовать несколько запросов, увеличивая &offset=N.

        **Например**:  
        `&offset=0&limit=10` - отобразит первые 10 матчей  
        `&offset=10&limit=10` - отобразит следующие 10 матчей (пропуская первые 10)
                    
        ---

        #### Примеры:
        Извлечение всех матчей по id лиги и году сезона  
        https://api.sstats.net/games/list?leagueid=183&year=2022

        Извлечение всех матчей по id сезона 1DC9CB60-0958-11EE-B462-879841420925  
        https://api.sstats.net/games/list?seasonUid=1DC9CB60-0958-11EE-B462-879841420925

        Извлечение всех матчей по id лиги и временному интервалу  
        https://api.sstats.net/games/list?leagueid=183&from=2022-10-30&to=2022-12-30

        Предстоящие матчи команды  
        https://api.sstats.net/games/list?upcoming=true&team=529

        Прошедшие матчи между командами когда они играли друг с другом (Head 2 Head)  
        https://api.sstats.net/games/list?ended=true&bothTeams=529,541
      parameters:
        - name: Id
          in: query
          description: Id матча. Один или несколько через запятую.
          schema:
            pattern: ^\d+(?:,\d+)*$
            type: string
          example: 1415356,1469598
        - name: FlashId
          in: query
          description: |-
            Id матча c Flashscore. Один или несколько через запятую.
            <example>"vyHkOT87,SYAMaLNi"</example>
          schema:
            pattern: ^\w+(?:,\w+)*$
            type: string
        - name: LeagueId
          in: query
          description: >-
            Id лиги

            <remarks>Список лиг можно получить через
            <code>/leagues</code></remarks>
          schema:
            maximum: 2147483647
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: "310"
        - name: SeasonUid
          in: query
          description: Уникальный идентификатор сезона
          schema:
            type: string
            format: uuid
          example: B1D3B841-5716-11F0-9829-3CECEF730A49
        - name: Year
          in: query
          description: Год сезона
          schema:
            maximum: 2070
            minimum: 2011
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: "2025"
        - name: Date
          in: query
          description: >-
            Конкретная дата. В выборку будут включены все матчи за выбранный
            день.  

            Чтобы указать часовой пояс, используйте параметр
            <code>TimeZone</code>.
          schema:
            pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
            type: string
          example: 2025-06-02
        - name: From
          in: query
          description: >-
            Начальная дата. Если указана только дата без времени, то будут
            включены все матчи за текущую дату, начиная с полуночи.

            Если не указывается время с часовым поясом
            (2025-06-17T14:23:30+02:00), то часовой пояс необходимо передать
            отдельно в параметре <code>TimeZone</code><remarks>

            Дата + время + часовой пояс: 2025-06-17T14:23:30+02:00  

            Дата + время: 2025-06-17T14:23:30  

            Дата + время (без секунд): 2025-06-17T14:23  

            Дата: 2025-06-17</remarks>
          schema:
            type: string
          example: 2025-06-17
        - name: To
          in: query
          description: >-
            Конечная дата. Фильтруются все матчи строго до этой даты. Если
            указана только дата, без времени, то в выборку включаются все матчи
            до полуночи указанной даты.

            Для всех дат, где не указан часовой пояс (+02:00) необходимо указать
            часовой пояс отдельно в параметре <code>TimeZone</code>

            Например: если To = 2025-06-02, то в выборку попадут все матчи
            до  2025-06-02 00:00:00. Т.е матчи за само 2025-06-02 уже выборку не
            попадают

            <remarks>

            Дата + время + часовой пояс: 2025-06-18T14:23:30+02:00  

            Дата + время: 2025-06-18T14:23:30  

            Дата + время (без секунд): 2025-06-18T14:23  

            Дата: 2025-06-18</remarks>
          schema:
            type: string
          example: 2025-06-18
        - name: Status
          in: query
          description: Статус (см [таблицу статусов](#tag/games/GET/Games/{id}))
          schema:
            maximum: 20
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: uint8
          example: "2"
        - name: HomeTeam
          in: query
          description: Id команды хозяев (один, или несколько через запятую)
          schema:
            pattern: ^\d+(?:,\d+)*$
            type: string
          example: 18047,8045
        - name: AwayTeam
          in: query
          description: Id команды гостей (один, или несколько через запятую)
          schema:
            pattern: ^\d+(?:,\d+)*$
            type: string
          example: 18047,8045
        - name: Team
          in: query
          description: >-
            Id одной из команд (один, или несколько через запятую).

            <remarks>Если указано несколько Id, то выборку попадут все матчи,
            где хотя бы одна из команд в это списке</remarks>
          schema:
            pattern: ^\d+(?:,\d+)*$
            type: string
          example: 18047,8045
        - name: BothTeams
          in: query
          description: Id двух команд через запятую. Матчи двух команд между собой
          schema:
            pattern: ^\d+,\d+$
            type: string
          example: 18047,8045
        - name: Ended
          in: query
          description: |-
            Завершенные матчи (8, 9, 10, 17, 18).  
            Учитывается только True, False не учитывается
          schema:
            type: boolean
        - name: Live
          in: query
          description: |-
            Лайв матчи (статусы 3, 4, 5, 6, 7, 11, 18, 19).
            Учитывается только True, False не учитывается
          schema:
            type: boolean
        - name: Upcoming
          in: query
          description: "Предстоящие матчи (дата начала матча больше текущего времени +
            статус: 1,2). Учитывается только True, False не учитывается"
          schema:
            type: boolean
        - name: Today
          in: query
          description: Матчи за сегодня. Учитывается только True, False не учитывается
          schema:
            type: boolean
        - name: Offset
          in: query
          description: >-
            Пропустить указанное количество матчей от начала выборки. По
            умолчанию = 0

            <remarks>

            Количество матчей выводимое за раз ограничено лимитом 1000 матчей.
            Чтобы извлечь остальные матчи, используется Offset c указанием
            количества, которое надо пропустить

            <code>offset=2000</code> - пропустить первые 2000 матчей и получить
            следущие 1000

            </remarks><example>2000</example>
          schema:
            maximum: 2147483647
            minimum: 0
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: Limit
          in: query
          description: Ограничить выборку указанным количеством матчей (от 1 до 1000)
          schema:
            maximum: 1000
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: Order
          in: query
          description: Сортировать по убыванию (Order=-1) или по возрастанию (Order=1)
            даты начала матча
          schema:
            maximum: 1
            minimum: -1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
          example: "-1"
        - name: TimeZone
          in: query
          description: Ваш часовой пояс (от -12 до 12). По умолчанию = 3
          schema:
            maximum: 12
            minimum: -12
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 3
          example: "3"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaGame[]"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /Games/{id}:
    get:
      tags:
        - Games
      summary: Данные матча
      description: >-
        Получить полные данные о конкретном матче. 
                    
        Можно передать как числовой Id, использующийся в SStats.net так и
        строковый Id с Flashscore.com
                    
        Полные данные о матче, включая:

        - основная информация о матче (команды, счёт, статус, время)

        - статистика матча (удары, владение мячом, угловые и т.д.)

        - стартовые составы и тактические схемы команд

        - список игроков в составах с позициями

        - индивидуальная статистика игроков

        - события матча (голы, замены, карточки)

        - информация о стадионе, судье

        - доматчевые коэффициенты закрытия в сокращенном варианте. ([Все
        коэффициенты здесь](#tag/odds/GET/Odds/{gameId}))
                    
        ### Частота обновления данных
                    
        | Тип матча                        | Частота обновления       |

        |---------------------------------|--------------------------|

        | Лайв (идущие сейчас)            | каждую минуту            |

        | Недавние (последние сутки)      | каждые 15 минут          |

        | Доматчевые (до 30 дней назад)   | раз в сутки              |
                    
        ### Статусы матча


        | Код | Описание                             |

        |-----| -------------------------------------|

        | 1   | Дата матча ещё не объявлена          |

        | 2   | Матч ещё не начался                  |

        | 3   | Начало первого тайма                 |

        | 4   | Перерыв между таймами                |

        | 5   | Начало второго тайма                 |

        | 6   | Дополнительное время                 |

        | 7   | Идёт серия пенальти                  |

        | 8   | Матч завершён                        |

        | 9   | Матч завершён после доп. времени     |

        | 10  | Матч завершён после серии пенальти   |

        | 11  | Перерыв в дополнительном времени     |

        | 12  | Матч приостановлен                   |

        | 13  | Матч прерван                         |

        | 14  | Матч перенесён                       |

        | 15  | Матч отменён                         |

        | 17  | Техническое поражение                |

        | 18  | Победа без игры (соперник не явился) |

        | 19  | Матч в процессе                      |
      parameters:
        - name: id
          in: path
          description: sstats.net ID или Flashscore ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiSaGameFull"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
  /Games/glicko/{id}:
    get:
      tags:
        - Games
      summary: Glicko 2
      description: Рейтинг Glicko 2 и предсказание вероятностей победы команд
      parameters:
        - name: id
          in: path
          description: Id матча. Sstats Id в виде числа или Flashscore Id в виде строки
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiGameGlicko"
  /Games/query:
    post:
      tags:
        - Games
      summary: Расширенный поиск
      description: >-
        Извлечение матчей на основе сложных многоуровневых логических условий. 
                    
        Условие использует SQL подобный синтаксис. Сложные выражения
        поддерживаются в выводимых полях (Fields), в условии (Condition) и
        сортировке (Order)
                    
        [Подробное руководство](https://sstats.net/posts/api-query-games-2)


        Пример условия:  

        <code>LeagueId = 39 AND (Year = 2023 OR Year = 2024) AND Winner1 > 1.1
        AND Winner1 <= 1.3</code>  

        Этот запрос выводит все матчи лиги с идентификатором 30 (Английская
        премьер лига) в сезонах 2023 и 2024,

        у которых коэффициент на победу команды хозяев находится в промежутке от
        1.1 до 1.3 (включительно)
                    

                    
        **Field** настраивает выводимые поля  

        **Order** настраивает поля сортировки
                    

        Запрос отправляется в формате POST c типом application/json, в теле
        которого содержится json с указанным объектом
                    
        #### Подробное руководство по продвинутым запросам [➔
        Перейти](https://sstats.net/posts/api-query-games-2)

        ---


        Пример содержимого body запроса:  

        ```json

        {
            "Condition" : "LeagueId = 39 AND (Year = 2023 OR Year = 2024) AND Winner1 > 1.1 AND Winner1 <= 1.3",
            "Fields" : ["Id","Date","HomeTeamName","AwayTeamName","ScoreHomeFT","ScoreAwayFT", "Winner1", "WinnerX", "Winner2"],
            "Order" : "Date DESC"
            "Format" : "csv"
        }

        ``` 
      parameters:
        - name: timeZone
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryGamesRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/QueryGamesRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/QueryGamesRequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json: {}
            text/csv: {}
  /Games/season-table:
    get:
      tags:
        - Games
      summary: Рейтинговая таблица
      description: >-
        Возвращает рейтинговую таблицу команд указанной лиги.

        Рейтинговая таблица похожа на обычную турнирную таблицу, но учитывает
        все матчи всех групп суммарно, либо может учитывать несколько сезонов.

        Т.е это не официальная турнирная таблица, а вычисляемая, с возможностью
        настройки количества матчей.

        Официальная турнирная таблица здесь:
        [/seasons/standings](#tag/seasons/GET/Seasons/standings)
                    
        Таблица формируется на основе результатов завершенных матчей и включает
        статистику команд:

        - Позицию в турнире

        - Количество игр, побед, ничьих, поражений

        - Забитые и пропущенные голы

        - Очки и другие показатели


        **Форматы ответа:**

        - `JSON` (по умолчанию) - структурированные данные для программного
        использования

        - `CSV` - табличный формат для экспорта в Excel или другие приложения


        **Дополнительные возможности:**

        - Ограничение количества записей через параметр `limit`

        - Выбор конкретных полей для CSV через параметр `fields`

        - Сортировка по любому полю через параметр `orderField`
                    
        **Доступные поля для параметра `fields`:**


        | Название | Описание |

        |----------|----------|

        | TeamId | ID команды |

        | TeamName | Название команды |

        | TotalGames | Всего игр |

        | Wins | Победы |

        | Draws | Ничьи |

        | Loss | Поражения |

        | GoalsScored | Забитые голы |

        | GoalsMissed | Пропущенные голы |

        | Points | Очки |

        | Over25TotalGames | Игры с тоталом больше 2.5 |

        | Under25TotalGames | Игры с тоталом меньше 2.5 |

        | Over25TotalHomeGames | Домашние игры с тоталом больше 2.5 |

        | Under25TotalHomeGames | Домашние игры с тоталом меньше 2.5 |

        | Over25TotalAwayGames | Гостевые игры с тоталом больше 2.5 |

        | Under25TotalAwayGames | Гостевые игры с тоталом меньше 2.5 |

        | HomeGames | Домашние игры |

        | AwayGames | Гостевые игры |

        | HomeWins | Домашние победы |

        | AwayWins | Гостевые победы |

        | HomeDraws | Домашние ничьи |

        | AwayDraws | Гостевые ничьи |

        | HomeLoss | Домашние поражения |

        | AwayLoss | Гостевые поражения |

        | HomeScored | Голы в домашних играх |

        | AwayScored | Голы в гостевых играх |

        | HomeMissed | Пропущенные голы в домашних играх |

        | AwayMissed | Пропущенные голы в гостевых играх |

        | HomePoints | Очки в домашних играх |

        | AwayPoints | Очки в гостевых играх |

        | ScoreDiff | Разность голов |

        | ScoreDiffHome | Разность голов в домашних играх |

        | ScoreDiffAway | Разность голов в гостевых играх |

        | Rank | Место в турнирной таблице |

        | HomeRank | Место в домашней таблице |
      parameters:
        - name: league
          in: query
          description: Идентификатор лиги/турнира
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: year
          in: query
          description: Год сезона
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: limit
          in: query
          description: Максимальное количество матчей для расчета таблицы (0 = без
            ограничений)
          schema:
            maximum: 1000
            minimum: 5
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 1000
        - name: format
          in: query
          description: 'Формат ответа: "json" (по умолчанию) или "csv"'
          schema:
            type: string
            default: json
        - name: fields
          in: query
          description: 'Список полей через запятую для CSV формата (например:
            "TeamName,Points,Wins")'
          schema:
            type: string
        - name: orderField
          in: query
          description: Поле для сортировки. Для убывающей сортировки добавьте "-" перед
            названием поля
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfRankTable"
            text/csv:
              schema:
                $ref: "#/components/schemas/ApiResponseOfRankTable"
  /Games/last-games-stats:
    get:
      tags:
        - Games
      summary: Предматчевая статистика команд
      description: >-
        Возвращает усреднённые показатели **обеих команд** за их последние N
        матчей, сыгранных **до даты** указанного матча.
                    
        > **Важно:** метод принимает `gameId` — идентификатор конкретного
        **матча**, а не команды.

        > Статистика всегда рассчитывается в контексте этого матча: берутся
        команды-участники и их завершенные матчи.
                    
        ### Что возвращается

        Два объекта — `home` (хозяева) и `away` (гости) — каждый содержит:

        - **Голы:** среднее забитых и пропущенных

        - **xG:** среднее xG и xG против (из коэффициентов), MAE и RMSE

        - **Удары, угловые, офсайды, карточки** — средние за и против

        - **Коэффициенты:** средние на победу / ничью / поражение

        - **Форма:** количество побед, ничьих, поражений и `gamesCount`
                    
        ### Фильтрация выборки

        По умолчанию берутся все матчи команды из любых лиг и сезонов.

        Параметры `sameLeague`, `sameSeason` и `homeAway` позволяют сузить
        выборку.

        Если после фильтрации у одной из команд меньше 5 матчей — метод вернёт
        ошибку.
      parameters:
        - name: gameId
          in: query
          description: Id матча, для которого рассчитывается статистика
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: limit
          in: query
          description: Количество последних матчей для расчёта (от 5 до 100). По умолчанию
            25
          schema:
            maximum: 100
            minimum: 5
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 25
        - name: sameLeague
          in: query
          description: Учитывать только матчи в той же лиге, что и матч `gameId`
          schema:
            type: boolean
            default: false
        - name: sameSeason
          in: query
          description: Учитывать только матчи в том же сезоне и лиге, что и матч `gameId`
          schema:
            type: boolean
            default: false
        - name: homeAway
          in: query
          description: Для хозяев — только домашние матчи; для гостей — только выездные
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: ""
          content:
            application/json: {}
  /Games/text-summary:
    get:
      tags:
        - Games
      summary: Текстовая сводка
      description: >-
        Генерирует детальную текстовую сводку по футбольному матчу, включающую:


        - **Букмекерские коэффициенты** на все основные исходы (победа, ничья,
        тоталы)

        - **Ожидаемые голы** (xG) по оценкам букмекеров

        - **Анализ прибыльности** различных типов ставок на основе исторических
        данных

        - **Статистику команд**: проценты побед/ничьих/поражений, средние
        коэффициенты

        - **Голевую статистику**: среднее количество забитых/пропущенных голов,
        точность прогнозов букмекеров


        Анализ основан на предыдущих матчах команд с возможностью фильтрации по
        лиге и типу матчей (дома/в гостях).
      parameters:
        - name: id
          in: query
          description: Уникальный идентификатор футбольного матча
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: limit
          in: query
          description: Лимит количества последних матчей (от 5 до 30). 25 - по умолчанию
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 25
        - name: sameLeague
          in: query
          description: Учитывать только матчи из той же лиги что и анализируемый матч (по
            умолчанию true)
          schema:
            type: boolean
            default: true
        - name: homeAway
          in: query
          description: Учитывать только домашние матчи для хозяев и гостевые для гостей
            (по умолчанию false)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Текстовая сводка с детальной статистикой и коэффициентами по матчу
          content:
            application/json: {}
            text/plain: {}
  /Games/profits:
    get:
      tags:
        - Games
      summary: Калькуляция прибыли
      description: >-
        **Калькуляция прибыли по видам ставок**


        Анализирует историческую прибыльность различных видов ставок для
        домашней и выездной команд на основе их предыдущих матчей.


        Метод возвращает детальную статистику по прибыльности ставок:

        - **Полный матч** - анализ ставок за весь матч

        - **Первый тайм** - анализ ставок за первую половину

        - **Второй тайм** - анализ ставок за вторую половину


        Для каждого типа ставок показывается:

        - Общая прибыль/убыток

        - История изменения прибыли

        - Количество проанализированных игр

        - Количество выигрышных ставок


        Поддерживается гибкая фильтрация исторических данных для более точного
        анализа.
      parameters:
        - name: gameId
          in: query
          description: Уникальный идентификатор матча для анализа
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: thisLeague
          in: query
          description: "Учитывать только игры в рамках той же лиги (по умолчанию: false)"
          schema:
            type: boolean
            default: false
        - name: homeAway
          in: query
          description: "Учитывать только домашние игры для домашней команды и выездные для
            выездной (по умолчанию: false)"
          schema:
            type: boolean
            default: false
        - name: sameGames
          in: query
          description: "Учитывать только игры с похожими показателями xG (expected goals)
            - разница не более 0.2 (по умолчанию: false)"
          schema:
            type: boolean
            default: false
        - name: bookieId
          in: query
          description: Идентификатор конкретного букмекера для анализа коэффициентов
            (опционально)
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: limit
          in: query
          description: "Максимальное количество предыдущих игр для анализа (по умолчанию:
            25, диапазон: 5-100)"
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 25
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfApiMatchProfit"
