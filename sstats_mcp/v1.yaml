                $ref: "#/components/schemas/ApiResponseOfObject"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOfObject"
components:
  schemas:
    AccountInfo:
      type: object
      properties:
        userName:
          type: string
        apiKey:
          type: string
    ApiGameGlicko:
      required:
        - fixture
        - glicko
      type: object
      properties:
        fixture:
          $ref: "#/components/schemas/ApiSaGame"
        glicko:
          $ref: "#/components/schemas/ApiGlicko"
    ApiGlicko:
      type: object
      properties:
        homeRating:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: float
        homeRd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: float
        awayRating:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: float
        awayRd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: float
        homeXg:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: float
        awayXg:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: float
        homeWinProbability:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: float
        awayWinProbability:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - "null"
            - number
            - string
          format: float
        updated:
          type: string
          format: date-time
        homeVolatility:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: float
        awayVolatility:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: float
    ApiLiveOddsLastUpdate:
      type: object
      properties:
        gameId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        lastUpdate:
          type: string
          format: date-time
    ApiMarketChangeHistory:
      type: object
      properties:
        marketId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int16
        marketName:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ApiOutcomeChanges"
    ApiMarketProfit:
      required:
        - market
        - outcomes
      type: object
      properties:
        market:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ApiTeamOutcomeProfit"
    ApiMatchProfit:
      required:
        - home
        - homeFirstHalf
        - homeSecondHalf
        - away
        - awayFirstHalf
        - awaySecondHalf
      type: object
      properties:
        home:
          type: array
          items:
            $ref: "#/components/schemas/ApiMarketProfit"
          description: Профит команды хозяев за основное время
        homeFirstHalf:
          type: array
          items:
            $ref: "#/components/schemas/ApiMarketProfit"
          description: Профит команды хозяев за первые таймы
        homeSecondHalf:
          type: array
          items:
            $ref: "#/components/schemas/ApiMarketProfit"
          description: Профит команды хозяев за вторые таймы
        away:
          type: array
          items:
            $ref: "#/components/schemas/ApiMarketProfit"
          description: Профит команды гостей за основное время
        awayFirstHalf:
          type: array
          items:
            $ref: "#/components/schemas/ApiMarketProfit"
          description: Профит команды гостей за первые таймы
        awaySecondHalf:
          type: array
          items:
            $ref: "#/components/schemas/ApiMarketProfit"
          description: Профит команды гостей за вторые таймы
    ApiOddsValueChange:
      type: object
      properties:
        elapsedSeconds:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int16
        createdTime:
          type: string
          format: date-time
        value:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - number
            - string
          format: double
    ApiOutcomeChanges:
      type: object
      properties:
        outcomeId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int16
        outcomeName:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ApiOddsValueChange"
    ApiPariCountry:
      required:
        - name
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        code:
          type:
            - "null"
            - string
        name:
          type: string
        url:
          type:
            - "null"
            - string
    ApiPariEvents:
      required:
        - events
        - stats
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/GameplayEvent"
          description: "Список игровых событий матча (голы, карточки, замены, угловые и
            т.д.),\r

            очищенный от отменённых и технических событий, отсортированный по
            времени регистрации"
        stats:
          oneOf:
            - type: "null"
            - description: "Накопленная игровая статистика, вычисленная на основе потока сырых
                событий.\r

                Включает голы, карточки, угловые, удары, атаки, владение мячом и
                другие показатели\r

                отдельно для хозяев (Home) и гостей (Away)"
              $ref: "#/components/schemas/MatchStatistics"
      description: Игровые события матча и накопленная статистика
    ApiPariMarket:
      required:
        - name
        - outcomes
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Идентификатор типа маркета
          format: int32
        name:
          type: string
          description: Системное название маркета
        description:
          type:
            - "null"
            - string
          description: Человекочитаемое описание маркета
        hasParameter:
          type: boolean
          description: Маркет имеет числовой параметр (тотал, фора)
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ApiPariOutcomeItem"
          description: Исходы данного маркета
    ApiPariMatch:
      required:
        - matchInfo
      type: object
      properties:
        matchInfo:
          description: Данные матча
          $ref: "#/components/schemas/ApiPariMatchInfo"
        currentOdds:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/ApiPariOddsItem"
          description: "Актуальные на данный момент коэффициенты. Если матч в лайве, то
            здесь будут Live коэффициенты.\r

            Если матч ещё не начался, то здесь будут доматчевые коэффициенты"
        prematchOdds:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/ApiPariOddsItem"
          description: Последние доматчевые коэффициенты
    ApiPariMatchInfo:
      required:
        - tournament
        - homeTeam
        - awayTeam
      type: object
      properties:
        eventId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Id события на сайте Pari.ru
          format: int32
        startDate:
          type: string
          description: Начало матча
          format: date-time
        status:
          $ref: "#/components/schemas/PariMatchStatus"
        tournament:
          $ref: "#/components/schemas/ApiPariTournament"
        homeTeam:
          $ref: "#/components/schemas/ApiPariTeam"
        awayTeam:
          $ref: "#/components/schemas/ApiPariTeam"
        homeScore:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Общий счет хозяев
          format: uint8
        awayScore:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Общий счет гостей
          format: uint8
        homeScoreHT:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Счет первого тайма хозяев
          format: uint8
        awayScoreHT:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Счет первого тайма гостей
          format: uint8
        liveSeconds:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Секунда матча (для лайва)
          format: int32
        liveAddedTime:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Добавленное время (для лайва, в минутах)
          format: int32
        liveFirstHalfAddedTime:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Добавленное время первого тайма (для лайва, в минутах)
          format: int32
        url:
          type:
            - "null"
            - string
        lastUpdate:
          type:
            - "null"
            - string
          description: Время последнего обновления данных о матче
          format: date-time
        isDeleted:
          type:
