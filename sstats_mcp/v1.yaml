      summary: Справочник маркетов и исходов
      description: >-
        Полный список маркетов с исходами. Используется для расшифровки
        outcomeId, возвращаемого в истории коэффициентов.


        Примечание: для каждого периода (1ый тайм, 2-ой тайм) outcome id разные.
        Т.е outcomeId для 1X2:П1 для первого тайма отличается от того же самого
        1X2:П1 для второго тайма 
      responses:
